appId: com.olympus.onode
name: ONODE-14 TC-008 tapping quote POSTs and renders returned price and discount
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ONODE Parking"
    timeout: 20000
- tapOn:
    id: "vehicle-car"
- tapOn:
    id: "months-input"
- inputText: "6"
- tapOn:
    id: "quote-button"
- extendedWaitUntil:
    visible: "8100 THB"
    timeout: 10000
- assertVisible: "8100 THB"
- assertVisible: "discount 10%"
- takeScreenshot: results/maestro/shots/ONODE-14-TC-008