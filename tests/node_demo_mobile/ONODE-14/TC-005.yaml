appId: com.olympus.onode
name: ONODE-14 TC-005 car with blank months shows months is required
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ONODE Parking"
    timeout: 20000
- tapOn:
    id: "vehicle-car"
- tapOn:
    id: "quote-button"
- extendedWaitUntil:
    visible: "months is required"
    timeout: 10000
- assertVisible: "months is required"