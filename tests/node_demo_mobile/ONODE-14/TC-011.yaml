appId: com.olympus.onode
name: ONODE-14 TC-011 successful quote renders price and discount with no other requests
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ONODE Parking"
    timeout: 20000
- tapOn:
    id: "vehicle-car"
- tapOn:
    id: "months-input"
- inputText: "6"
- tapOn:
    id: "quote-button"
- extendedWaitUntil:
    visible: "8100 THB"
    timeout: 10000
- assertVisible: "8100 THB"
- assertVisible: "discount 10%"